    <polygon points="130,60 270,-10 270,35 130,105" fill="#c9a45c"/>
    <polygon points="130,150 270,80 270,125 130,195" fill="#c9a45c"/>
    <polygon points="130,240 270,170 270,215 130,285" fill="#c9a45c"/>
    <polygon points="130,330 270,260 270,305 130,375" fill="#c9a45c"/>
    <polygon points="130,420 270,350 270,395 130,465" fill="#c9a45c"/>
