  <rect x="140" y="90" width="120" height="340" rx="14" fill="none" stroke="#c9a45c" stroke-width="4"/>
  <rect x="130" y="68" width="140" height="28" rx="8" fill="#c9a45c"/>
  <rect x="150" y="44" width="100" height="26" rx="8" fill="#8f7338"/>
