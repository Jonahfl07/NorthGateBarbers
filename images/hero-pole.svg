<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Decorative illustration of a barber pole" focusable="false">
  <defs>
    <clipPath id="tube"><rect x="140" y="90" width="120" height="340" rx="14"/></clipPath>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#c9a45c" stroke-opacity=".25">
    <circle cx="200" cy="260" r="230" stroke-width="1"/>
    <circle cx="200" cy="260" r="180" stroke-width="1"/>
    <circle cx="200" cy="260" r="130" stroke-width="1"/>
  </g>
  <rect x="150" y="440" width="100" height="22" rx="6" fill="#c9a45c"/>
  <rect x="165" y="462" width="70" height="14" rx="4" fill="#8f7338"/>
